<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>YouTube Super Lite</title>
  </head>
  <body>
    <h1>YouTube Super Lite</h1>
    <!--
      操作の相手が「今見ているタブ」だけであることは、パネルを見ても分からない（開いている他の
      タブは動かないので、変わらないことに気付けない）。先に書いておく。
    -->
    <p>設定は今見ているタブに効く。他に開いているタブは変わらない。</p>
    <p>変えた値は、次に開くタブが最初に使う値になる。</p>
    <!--
      機能ごとの UI は section 1 つに閉じる。機能の追加や変更が他の section の中身に
      及ばないようにするため。
    -->
    <section id="equalizer">
      <h2 id="equalizer-heading">イコライザ</h2>
      <!--
        プリセット ID の一覧は shared/equalizer が唯一の出所。ここの value はそれと 1 対 1 で
        対応していなければならず、ずれていればパネルの読み込み（side-panel/equalizer.ts）で落ちる。
        中身（各段の周波数やゲイン）はここには書かない。利用者が選ぶのは用途であって数値ではない。

        ラジオの群れの名前は section の見出しをそのまま借りる。fieldset / legend にすると
        見出しと同じ文言を二重に出すか、群れだけ別の名前を持つかになる。
      -->
      <div role="radiogroup" aria-labelledby="equalizer-heading">
        <p><label><input type="radio" name="eq-preset" value="off" />オフ</label></p>
        <p><label><input type="radio" name="eq-preset" value="clarity" />聞き取り最優先</label></p>
        <p><label><input type="radio" name="eq-preset" value="music" />音楽</label></p>
      </div>
    </section>
    <section id="chat-display">
      <h2>チャット表示</h2>
      <!--
        スライダーの可動域（min / max / step）は書かない。範囲は shared/settings が持つ値が唯一の
        出所で、side-panel.js が読み込み時に与える。
      -->
      <p>
        <label for="chat-font-size">文字サイズ</label>
        <input id="chat-font-size" type="range" />
        <output id="chat-font-size-value" for="chat-font-size"></output>
      </p>
      <!--
        パネル幅のつまみはここに置かない。幅は見ている画面を見ながら決めるものなので、
        watch ページのチャット左端に付くハンドルで変える（isolated/chat-resize）。
        置き場所が分からないと触れないので、どこにあるかだけ書いておく。
      -->
      <p>チャットの幅は、watch ページのチャット左端をドラッグして変える。</p>
    </section>
    <section id="watch-declutter">
      <h2>watch ページの整理</h2>
      <p>
        <label>
          <input type="checkbox" id="remove-comments" />
          コメント欄を消す
        </label>
      </p>
      <!--
        消したノードは戻せないので、チェックを外した効果が現れるのは次に開いた watch ページから。
        「外したのに戻らない」と見えるのを避けるため、UI の側で先に伝える。
      -->
      <p>チェックを外したときは、ページを開き直すとコメント欄が戻る。</p>
      <p>右側の「次の動画」の列は常に消す。</p>
    </section>
    <!-- MV3 の CSP でインラインスクリプトは動かないので、必ず外部ファイルとして読む。 -->
    <script src="side-panel.js"></script>
  </body>
</html>
