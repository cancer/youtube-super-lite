<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>YouTube Super Lite</title>
  </head>
  <body>
    <h1>YouTube Super Lite</h1>
    <!--
      各機能の UI はこの枠の中身として後から入る（R4 のイコライザ / R5 のチャット表示）。
      枠だけを先に置いてあるので、機能ごとの追加は section の中身に閉じる。
    -->
    <section id="equalizer">
      <h2>イコライザ</h2>
      <!--
        3 ノブの値域（ゲインの端・カットオフの段）は shared/equalizer が唯一の出所なので、
        ここには書かない。range の min/max と select の選択肢は側パネルの JS が組み立てる。
      -->
      <p>
        <label for="eq-voice-gain">声の強調</label>
        <input id="eq-voice-gain" type="range" step="0.5" />
        <output id="eq-voice-gain-value" for="eq-voice-gain"></output>
      </p>
      <p>
        <label for="eq-lowpass">高域カット</label>
        <select id="eq-lowpass"></select>
      </p>
      <p>
        <label for="eq-highpass">低域カット</label>
        <select id="eq-highpass"></select>
      </p>
    </section>
    <section id="chat-display">
      <h2>チャット表示</h2>
      <p id="chat-display-values"></p>
    </section>
    <!-- MV3 の CSP でインラインスクリプトは動かないので、必ず外部ファイルとして読む。 -->
    <script src="side-panel.js"></script>
  </body>
</html>
